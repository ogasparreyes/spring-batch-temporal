spring:
  application:
    environment: DEV

  temporal:
    namespace: default
    connection:
      target: 127.0.0.1:7233
    workers-auto-discovery:
      packages: com.gentera.tcapp

  datasource:
    url: jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  h2:
    console:
      enabled: true
      path: /h2-console
